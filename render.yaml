# Render Blueprint for Greenlight: the API and the website.
# The glasses app is not hosted: it is packaged as an .ehpk (see docs/DEPLOY.md).
# Values marked sync: false are asked for once when you create the Blueprint. Never put real values in this file.
services:
  - type: web
    name: greenlight-api
    runtime: node
    # SQLite needs a persistent disk, and disks need a paid instance. See docs/DEPLOY.md for the free option and its limits.
    plan: starter
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @greenlight/api start
    healthCheckPath: /health
    disk:
      name: greenlight-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SQLITE_PATH
        value: /var/data/greenlight.sqlite
      # Rules-only mode: no model and no model key needed. Remove this line once a model key is set.
      - key: POLICY_MODE
        value: rules
      - key: DEMO_MODE
        value: "0"
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # The website's address, for CORS and for the Google sign-in redirect back to the dashboard.
      - key: CORS_ORIGIN
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Google (optional until you connect Gmail and Calendar).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  - type: web
    name: greenlight-web
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @greenlight/web build
    startCommand: pnpm --filter @greenlight/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      # The API's public address. Read at build time, so rebuild after changing it.
      - key: NEXT_PUBLIC_API_URL
        sync: false
