name: CI

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Switch to --frozen-lockfile once pnpm-lock.yaml is committed (task D0-7).
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
